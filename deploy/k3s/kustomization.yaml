# BeeGit on K3s: CockroachDB + MinIO + beegit-server in namespace `beegit`.
#
# Secrets are generated from deploy/k3s/state (scripts/deploy-k3s.sh secrets) and never
# committed. scripts/deploy-k3s.sh streams a bundle of this directory to the VPS and runs
# `kubectl apply -k` there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beegit

resources:
  - namespace.yaml
  - cockroach.yaml
  - minio.yaml
  - beegit-server.yaml
  - beegit-web.yaml

images:
  - name: beegit
    newName: beecodersregistry.azurecr.io/beegit
    newTag: latest   # scripts/deploy-k3s.sh replaces this with the deployed version
  - name: beegit-web
    newName: beecodersregistry.azurecr.io/beegit-web
    newTag: latest

configMapGenerator:
  - name: beegit-config
    files:
      - beegit-server.toml=bundle/beegit-server.toml   # copied from config/ by scripts/deploy-k3s.sh
  - name: beegit-policy
    files:
      - acl.toml=state/acl.toml

secretGenerator:
  - name: beegit-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=state/tls.crt
      - tls.key=state/tls.key
  - name: beegit-signing
    files:
      - signing.ed25519.pem=state/signing.ed25519.pem
  - name: beegit-server-env
    envs:
      - state/secrets.env
  - name: beegit-s3
    envs:
      - state/s3.env

generatorOptions:
  labels:
    app.kubernetes.io/part-of: beegit
