# Static server for the BeeGit web UI (B-WEB-13). The Cloudflare Tunnel sends /beegit.v1.*
# to beegit-server and everything else here, so this server never sees API calls.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Headers only here: nginx drops server-level add_header in locations that add their own,
  # so caching below uses `expires` instead.
  # Same-origin API only; Shiki and React need inline styles; README images may be remote.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed build assets never change.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Client-side routes: every other path is the app (index.html is never cached).
  location / {
    expires epoch;
    try_files $uri /index.html;
  }
}
