[package]
name = "beegit-import"
description = "One-way git importer (SPEC 14)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "beegit-import"
path = "src/main.rs"

[lints]
workspace = true

[features]
testing = []

[dependencies]
beegit-core = { workspace = true }
beegit-object = { workspace = true }
beegit-proto = { workspace = true }
beegit-auth = { workspace = true }
gix = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
beegit-import = { path = ".", features = ["testing"] }
beegit-testkit = { workspace = true }
beegit-server = { workspace = true, features = ["testing"] }
